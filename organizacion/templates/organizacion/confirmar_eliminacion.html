{% extends 'usuarios/base.html' %}

{% block title %}Confirmar Eliminación{% endblock %}

{% block content %}
<div class="card shadow border-0 rounded-4 mt-4 border-danger">
    <div class="card-body p-5 text-center">
        <h2 class="card-title text-danger mb-3 fw-bold">Confirmar Eliminación</h2>
        <p class="lead text-dark">¿Estás seguro de que deseas eliminar <strong>"{{ object }}"</strong>?</p>
        <p class="text-muted mb-4">Esta acción no se puede deshacer y el registro será borrado de la base de datos.</p>
        
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-lg px-5 mb-3 rounded-3 shadow-sm">Sí, eliminar</button>
        </form>
        
        <!-- Un pequeño script en javascript para que el botón de cancelar regrese a la página anterior -->
        <button onclick="window.history.back()" class="btn btn-outline-secondary px-5 rounded-3">Cancelar</button>
    </div>
</div>
{% endblock %}
