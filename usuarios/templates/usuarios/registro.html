{% extends 'usuarios/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Registro de Usuario{% endblock %}

{% block content %}
<div class="card shadow border-0 rounded-4 mt-4">
    <div class="card-body p-5">
        <h2 class="card-title text-center mb-4 text-primary fw-bold">Crear una Cuenta</h2>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary btn-lg w-100 mt-4 rounded-3">Registrarse</button>
        </form>
        <hr class="my-4">
        <p class="text-center text-muted">¿Ya tienes una cuenta? <a href="{% url 'login' %}" class="text-decoration-none fw-bold">Inicia sesión aquí</a>.</p>
    </div>
</div>
{% endblock %}
