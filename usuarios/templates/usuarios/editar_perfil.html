{% extends 'usuarios/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Editar Perfil{% endblock %}

{% block content %}
<div class="card shadow border-0 rounded-4 mt-4">
    <div class="card-body p-5">
        <h2 class="card-title text-center mb-4 text-primary fw-bold">Editar Perfil</h2>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-success btn-lg w-100 mt-4 rounded-3">Guardar Cambios</button>
        </form>
        <div class="text-center mt-4">
            <a href="{% url 'bienvenida' %}" class="text-decoration-none">Volver a la página de inicio</a>
        </div>
    </div>
</div>
{% endblock %}
